[package]
name = "er-model-builder"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
maud = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
svg2pdf = "0.13"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
uuid = { version = "1", features = ["v4", "serde"] }
